# A local ORCHER engine for development: Postgres and the engine. The engine
# applies its schema migrations to the database every time it starts (only
# the ones the database doesn't have yet), then serves. Authentication is off,
# so any worker or client on this machine can connect without an API key. Do
# not expose these ports publicly.
#
#   docker compose up -d --wait     # start, and wait until the engine is healthy
#   docker compose down -v          # stop, and delete the database volume
#
# Environment variables (all optional; put them in a .env file to keep them):
#   ORCHER_IMAGE       engine image          default ghcr.io/orcher-io/orcher:0.5.1
#   ORCHER_GRPC_PORT   host port for gRPC    default 50051 (workers and clients)
#   ORCHER_HTTP_PORT   host port for HTTP    default 8080  (/health/ready, /metrics)
#   ORCHER_LOG_LEVEL   engine log level      default info
#
# If you change ORCHER_GRPC_PORT, point the examples at it with
# ORCHER_URL=http://localhost:<port>.

name: orcher-quickstart

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orcher
      POSTGRES_PASSWORD: orcher
      # Creates the database the engine uses: it must exist before the engine
      # starts, as the engine migrates it but never creates it.
      POSTGRES_DB: orcher
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcher -d orcher"]
      interval: 2s
      timeout: 3s
      retries: 30

  orcher:
    image: ${ORCHER_IMAGE:-ghcr.io/orcher-io/orcher:0.5.1}
    environment:
      DATABASE_URL: postgresql://orcher:orcher@postgres:5432/orcher
      GRPC_BIND_ADDR: 0.0.0.0:50051
      HTTP_BIND_ADDR: 0.0.0.0:8080
      LOG_LEVEL: ${ORCHER_LOG_LEVEL:-info}
      LOG_FORMAT: compact
    ports:
      - "${ORCHER_GRPC_PORT:-50051}:50051"
      - "${ORCHER_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The image's own health check (it has no curl), polled more often than
    # the image's default so that `up --wait` returns as soon as it passes:
    # healthy once migrations are applied and the engine answers
    # /health/ready.
    healthcheck:
      test: ["CMD", "orcher-entrypoint", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:

[package]
name = "orcher-quickstart"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "ORCHER quickstart: an order workflow and an AI agent in Rust"

[dependencies]
orcher-sdk = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
